openapi: 3.1.0

# ---------------------------------------------------------------------------
# Especificación de DEMOSTRACIÓN del Ashir Partner Hub.
#
# La API descrita todavía NO EXISTE. Este archivo documenta el contrato
# propuesto para que, cuando se defina el ERP de Ashir, la implementación
# tenga una referencia concreta. Ningún servidor responde estas rutas hoy.
# ---------------------------------------------------------------------------

info:
  title: Ashir Partner Hub API
  version: '2026-09-01'
  summary: Contrato propuesto para el portal B2B de Ashir Technology Corp.
  description: |
    Contrato de integración del **Ashir Partner Hub**: marketplace mayorista,
    pedidos, pricing explicable, programa de beneficios, RMA 360 y
    sincronización con el sistema de gestión.

    > **Estado: propuesta.** No hay un servicio publicado. El prototipo resuelve
    > estas operaciones con un adaptador local; el "Try it" del Centro de
    > Desarrolladores nunca sale a internet.

    ## Principios

    - Versionado explícito bajo `/v1`; los cambios incompatibles van a `/v2`.
    - Identificadores opacos: strings sin semántica, no parsear.
    - Importes como objeto `{ amount, currency }` con `amount` string, para
      evitar errores de coma flotante.
    - Fechas ISO 8601 con offset explícito.
    - `Idempotency-Key` obligatorio en creación de pedidos, solicitudes de
      precio especial y casos de RMA.
    - Concurrencia optimista con `version` o `If-Match` en edición de pedidos.
    - `X-Request-Id` en todas las respuestas para trazabilidad.
    - Los scopes del token determinan qué campos se devuelven: el costo y el
      margen de Ashir nunca viajan a una credencial de reseller.
  contact:
    name: Integraciones Ashir
    email: integraciones@ashir.example
  license:
    name: Uso interno / demostración

servers:
  - url: https://api.ashir.com.ar/v1
    description: Producción (futura)
  - url: https://sandbox.api.ashir.com.ar/v1
    description: Sandbox (futuro)
  - url: https://api.example.ashir.com.ar/v1
    description: Placeholder usado por el prototipo

tags:
  - name: Catálogo
    description: Productos, marcas, categorías y disponibilidad.
  - name: Pricing
    description: Evaluación de precios, listas y condiciones comerciales.
  - name: Clientes
    description: Resellers, cuenta corriente e historial de compras.
  - name: Pedidos
    description: Creación, modificación y seguimiento de pedidos.
  - name: RMA
    description: Garantías, seriales, casos, diagnóstico y resolución.
  - name: Product Management
    description: Métricas por marca y simulaciones comerciales.
  - name: Integraciones
    description: Estado y ejecución de los conectores con sistemas externos.

security:
  - bearerAuth: []

# ===========================================================================
# PATHS
# ===========================================================================

paths:
  /products:
    get:
      tags: [Catálogo]
      operationId: listProducts
      summary: Listar productos
      description: |
        Catálogo paginado. Los precios devueltos ya consideran la lista de
        precios del cliente asociado al token.
      security:
        - bearerAuth: [catalog:read]
      parameters:
        - { name: query, in: query, schema: { type: string }, description: Busca en nombre, SKU, part number, marca y categoría. }
        - { name: sku, in: query, schema: { type: string }, description: Coincidencia parcial por código interno. }
        - { name: brandId, in: query, schema: { type: string } }
        - { name: categoryId, in: query, schema: { type: string } }
        - { name: inStock, in: query, schema: { type: boolean } }
        - { name: promotionId, in: query, schema: { type: string } }
        - { name: minPrice, in: query, schema: { type: number, format: double } }
        - { name: maxPrice, in: query, schema: { type: number, format: double } }
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, price_asc, price_desc, best_sellers, newest, stock_desc]
            default: relevance
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Colección de productos.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Product' }
              example:
                data:
                  - id: prod_msvg5070tv3o
                    sku: MSVG5070TV3O
                    partNumber: V513-644R
                    name: MSI GEFORCE RTX 5070 Ti VENTUS 3X 16G OC
                    brand: MSI
                    category: GPUs
                    listPrice: { amount: '1195.48', currency: USD }
                    suggestedRetail: { amount: '1446.53', currency: USD }
                    vatRate: 0.21
                    stock: 12
                    availability: IN_STOCK
                    warrantyMonths: 36
                meta: { page: 1, pageSize: 24, total: 245, totalPages: 11 }
                requestId: req_demo_8f2a91bc
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /products/{productId}:
    get:
      tags: [Catálogo]
      operationId: getProduct
      summary: Detalle de producto
      description: |
        Ficha completa. Los campos `cost` y `marginPct` sólo se devuelven a
        tokens con scope `cost:read`; para el resto llegan en `null`.
      security:
        - bearerAuth: [catalog:read]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
          description: Id opaco o SKU del producto.
      responses:
        '200':
          description: Producto encontrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Product' }
                  requestId: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /products/{productId}/availability:
    get:
      tags: [Catálogo]
      operationId: getAvailability
      summary: Disponibilidad de un producto
      security:
        - bearerAuth: [catalog:read]
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Disponibilidad actual.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      productId: { type: string }
                      stock: { type: integer }
                      availability: { $ref: '#/components/schemas/Availability' }
                      incoming:
                        type: [object, 'null']
                        properties:
                          units: { type: integer }
                          etaDays: { type: integer }
                  requestId: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /brands:
    get:
      tags: [Catálogo]
      operationId: listBrands
      summary: Listar marcas
      security:
        - bearerAuth: [catalog:read]
      responses:
        '200':
          description: Marcas representadas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Brand' }
                  requestId: { type: string }

  /pricing/evaluate:
    post:
      tags: [Pricing]
      operationId: evaluatePricing
      summary: Evaluar precio
      description: |
        Devuelve el precio **explicado**: precio base, cada ajuste con su
        origen, el precio final y las condiciones que no aplicaron con su
        motivo. Es el endpoint que usa todo el portal, de modo que el desglose
        siempre coincide con el total cobrado.
      security:
        - bearerAuth: [pricing:read]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                productId: { type: string }
                quantity: { type: integer, minimum: 1 }
                paymentTerm: { $ref: '#/components/schemas/PaymentTerm' }
                date:
                  type: string
                  format: date-time
                  description: Fecha de evaluación. Por defecto, el momento del request.
            example:
              productId: prod_msmoprb650mb
              quantity: 10
              paymentTerm: TRANSFER_7
      responses:
        '200':
          description: Precio evaluado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PriceEvaluation' }
                  requestId: { type: string }
              example:
                data:
                  productId: prod_msmoprb650mb
                  sku: MSMOPRB650MB
                  quantity: 10
                  basePrice: { amount: '76.83', currency: USD }
                  adjustments:
                    - { type: PRICE_LIST, label: 'LP-PLATINUM-02 · MSI', percentage: '-5.00', amount: '-3.84' }
                    - { type: PROMOTION, conditionId: cond_msi_sept, label: MSI Septiembre, percentage: '-3.00', amount: '-2.19' }
                    - { type: VOLUME_TIER, conditionId: cond_volumen_general, label: 'Volumen general · 10+ unidades', percentage: '-4.00', amount: '-2.83' }
                  finalUnitPrice: { amount: '67.97', currency: USD }
                  lineTotal: { amount: '679.70', currency: USD }
                  totalDiscountPct: '-11.53'
                  validUntil: '2026-09-30T23:59:59-03:00'
                  explanation: Partiendo de USD 76.83 se aplican LP-PLATINUM-02 · MSI (-5.00%), MSI Septiembre (-3.00%), Volumen general · 10+ unidades (-4.00%), resultando en USD 67.97 por unidad.
                requestId: req_demo_7c19ba4f
        '404': { $ref: '#/components/responses/NotFound' }

  /price-lists:
    get:
      tags: [Pricing]
      operationId: listPriceLists
      summary: Listar listas de precios
      security:
        - bearerAuth: [pricing:read]
      responses:
        '200':
          description: Listas configuradas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PriceList' }
                  requestId: { type: string }

  /orders:
    get:
      tags: [Pedidos]
      operationId: listOrders
      summary: Listar pedidos
      description: Un token de reseller sólo ve los pedidos de su propia cuenta.
      security:
        - bearerAuth: [orders:read]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { name: customerId, in: query, schema: { type: string }, description: Sólo para tokens internos. }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Colección de pedidos.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Order' }

    post:
      tags: [Pedidos]
      operationId: createOrder
      summary: Crear pedido
      description: |
        Crea un pedido en estado `DRAFT`. **Requiere `Idempotency-Key`**:
        reenviar la misma clave devuelve el pedido ya creado en lugar de
        duplicarlo, lo que hace seguro el reintento ante un timeout.
      security:
        - bearerAuth: [orders:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, items]
              properties:
                customerId: { type: string }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [productId, quantity]
                    properties:
                      productId: { type: string }
                      quantity: { type: integer, minimum: 1 }
                customerPO: { type: string, description: Orden de compra del cliente. }
                notes: { type: string }
                deliveryMethod: { type: string, enum: [DELIVERY, PICKUP] }
            example:
              customerId: cus_gaming_store
              items:
                - { productId: prod_msmoprb650mb, quantity: 10 }
                - { productId: prod_ttgace300tgb, quantity: 12 }
              customerPO: OC-2291
              notes: Entregar por la mañana.
      responses:
        '201':
          description: Pedido creado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Order' }
                  requestId: { type: string }
        '400':
          description: El pedido no cumple una condición requerida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: ORDER_CONDITION_NOT_MET
                  message: El pedido ya no cumple la condición comercial.
                  details:
                    - { field: 'items[2].quantity', reason: MINIMUM_QUANTITY_NOT_MET }
                requestId: req_demo_456
        '409':
          description: Stock insuficiente o crédito excedido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /orders/{orderId}:
    get:
      tags: [Pedidos]
      operationId: getOrder
      summary: Detalle de pedido
      security:
        - bearerAuth: [orders:read]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Pedido encontrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Order' }
                  requestId: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [Pedidos]
      operationId: updateOrder
      summary: Modificar pedido
      description: |
        Concurrencia optimista: hay que enviar la `version` leída del pedido
        (o el header `If-Match`). Si el pedido cambió en otra sesión, la API
        responde `409 ORDER_VERSION_CONFLICT` y el cliente debe releer,
        resolver el conflicto y reintentar.

        Los estados que admiten modificación se publican en el campo
        `allowedModifications` del pedido.
      security:
        - bearerAuth: [orders:write]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - name: If-Match
          in: header
          schema: { type: string }
          description: Alternativa a `version` en el cuerpo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, description: Versión leída del pedido. }
                items:
                  type: array
                  description: Set completo de líneas; reemplaza al anterior.
                  items:
                    type: object
                    properties:
                      productId: { type: string }
                      quantity: { type: integer, minimum: 1 }
                notes: { type: string }
                customerPO: { type: string }
            example:
              version: 7
              items:
                - { productId: prod_msmoprb650mb, quantity: 8 }
      responses:
        '200':
          description: Pedido actualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Order' }
                  requestId: { type: string }
        '409':
          description: Conflicto de versión o pedido no editable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: ORDER_VERSION_CONFLICT
                  message: El pedido fue modificado desde otra sesión.
                  details:
                    - { field: version, reason: STALE_VERSION }
                requestId: req_demo_789

  /orders/{orderId}/audit-log:
    get:
      tags: [Pedidos]
      operationId: getOrderAuditLog
      summary: Historial del pedido
      description: Registro inmutable; cada cambio agrega un evento, nunca reemplaza el anterior.
      security:
        - bearerAuth: [orders:read]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Eventos del pedido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEvent' }
                  requestId: { type: string }

  /rma/serials/lookup:
    post:
      tags: [RMA]
      operationId: lookupSerial
      summary: Buscar por número de serie
      description: |
        Recupera producto, pedido, factura y garantía a partir del serial.

        **Regla crítica de privacidad:** la cuenta se toma del token, nunca del
        cuerpo del request. Si el serial pertenece a otro reseller, la respuesta
        NO incluye el objeto `record`: ni factura, ni fecha, ni precio, ni razón
        social del tercero. Un número de serie por sí solo nunca autoriza a ver
        información comercial ajena.
      security:
        - bearerAuth: [rma:read]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serial]
              properties:
                serial: { type: string }
            example:
              serial: 9MSI5070X93821
      responses:
        '200':
          description: Resultado del lookup.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SerialLookupResult' }
                  requestId: { type: string }
              examples:
                enGarantia:
                  summary: Serial propio, en garantía
                  value:
                    data:
                      status: IN_WARRANTY
                      serial: 9MSI5070X93821
                      warrantyDaysRemaining: 906
                      record:
                        sku: MSVG5070TV3O
                        productName: MSI GEFORCE RTX 5070 Ti VENTUS 3X 16G OC
                        brand: MSI
                        orderNumber: ASH-24853
                        invoiceNumber: FA-0004-00012831
                        purchasedAt: '2026-03-17T11:40:00-03:00'
                        warrantyMonths: 36
                        warrantyExpiresAt: '2029-03-17T11:40:00-03:00'
                        lotId: LOTE-MSI-260326-A
                    requestId: req_demo_b4710d28
                otraCuenta:
                  summary: Serial de otro reseller — sin datos del tercero
                  value:
                    data:
                      status: NOT_YOUR_ACCOUNT
                      serial: M4A7761200341
                      record: null
                      warrantyDaysRemaining: null
                      message: El producto fue distribuido por Ashir, pero no encontramos una compra asociada a tu cuenta. Contactá a tu ejecutivo para revisar el caso.
                    requestId: req_demo_c0ffee11
        '404': { $ref: '#/components/responses/NotFound' }

  /rma/cases:
    get:
      tags: [RMA]
      operationId: listRmaCases
      summary: Listar casos de garantía
      security:
        - bearerAuth: [rma:read]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/RmaStatus' } }
        - { name: breachedOnly, in: query, schema: { type: boolean }, description: Sólo casos fuera de SLA. }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Colección de casos.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/RmaCase' }

    post:
      tags: [RMA]
      operationId: createRmaCase
      summary: Crear caso de garantía
      description: |
        Crea una gestión con uno o varios seriales bajo una misma logística.
        Todos los seriales deben pertenecer a la cuenta del token.
      security:
        - bearerAuth: [rma:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serials, problemType, description]
              properties:
                serials:
                  type: array
                  minItems: 1
                  items: { type: string }
                problemType: { $ref: '#/components/schemas/RmaProblemType' }
                description: { type: string, minLength: 15 }
                answers:
                  type: array
                  items:
                    type: object
                    properties:
                      question: { type: string }
                      answer: { type: string }
                logisticsMode: { type: string, enum: [PICKUP, DROP_OFF, CARRIER] }
            example:
              serials: ['9MSI5070X93821']
              problemType: NO_VIDEO
              description: El equipo enciende pero no da imagen. Probado con dos monitores y tres cables distintos.
              answers:
                - { question: '¿Fue probada en otro equipo?', answer: 'Sí' }
              logisticsMode: CARRIER
      responses:
        '201':
          description: Caso creado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/RmaCase' }
                  requestId: { type: string }
        '403':
          description: Alguno de los seriales pertenece a otra cuenta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Ya existe un caso abierto para ese serial.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /rma/cases/{rmaId}/timeline:
    get:
      tags: [RMA]
      operationId: getRmaTimeline
      summary: Timeline del caso
      security:
        - bearerAuth: [rma:read]
      parameters:
        - { name: rmaId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Eventos del caso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RmaTimelineEvent' }
                  requestId: { type: string }

  /pm/brands/{brandId}/dashboard:
    get:
      tags: [Product Management]
      operationId: getPmDashboard
      summary: Dashboard de marca
      description: Ventas, margen, stock valorizado, cobertura, objetivo, mix y calidad.
      security:
        - bearerAuth: [pm:read]
      parameters:
        - { name: brandId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Métricas de la marca.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PmBrandDashboard' }
                  requestId: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }

  /integrations:
    get:
      tags: [Integraciones]
      operationId: listIntegrations
      summary: Listar integraciones
      description: |
        Estado de cada conector. El ERP de Ashir figura con
        `status: NOT_CONFIGURED` y `adapter: "Pendiente de definición"` porque
        todavía no se conoce el sistema de gestión de la empresa.
      security:
        - bearerAuth: [integrations:read]
      responses:
        '200':
          description: Conectores configurados.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Integration' }
                  requestId: { type: string }
              example:
                data:
                  - id: int_erp
                    name: ERP Ashir
                    kind: ERP
                    status: NOT_CONFIGURED
                    adapter: Pendiente de definición
                    mode: MOCK
                    lastSyncAt: null
                  - id: int_nodo
                    name: NODO
                    kind: CONNECTOR
                    status: OPERATIONAL
                    adapter: nodo-connector v1 (demo)
                    mode: DEMO
                    recordsProcessed: 247
                requestId: req_demo_d51b03ca

  /integrations/{integrationId}/runs:
    get:
      tags: [Integraciones]
      operationId: listIntegrationRuns
      summary: Ejecuciones de un conector
      security:
        - bearerAuth: [integrations:read]
      parameters:
        - { name: integrationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Historial de sincronizaciones.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/IntegrationRun' }
                  requestId: { type: string }

  /integrations/{integrationId}/sync:
    post:
      tags: [Integraciones]
      operationId: syncIntegration
      summary: Disparar sincronización
      security:
        - bearerAuth: [integrations:manage]
      parameters:
        - { name: integrationId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                entities:
                  type: array
                  items: { type: string }
                  description: Entidades a sincronizar. Vacío = todas las habilitadas.
            example:
              entities: [products, stock, prices]
      responses:
        '202':
          description: Sincronización disparada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/IntegrationRun' }
                  requestId: { type: string }
        '503':
          description: El servicio remoto no responde.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /integrations/nodo/test-connection:
    post:
      tags: [Integraciones]
      operationId: testNodoConnection
      summary: Probar la conexión con NODO
      security:
        - bearerAuth: [integrations:manage]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint: { type: string, format: uri }
                accountId: { type: string }
                environment: { type: string, enum: [DEMO, PRODUCTION] }
      responses:
        '200':
          description: Resultado de la prueba.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ok: { type: boolean }
                      message: { type: string }
                      latencyMs: { type: integer }
                  requestId: { type: string }

# ===========================================================================
# COMPONENTS
# ===========================================================================

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token emitido por OAuth2. Para usuarios humanos, Authorization Code
        con PKCE; para integraciones servidor a servidor, Client Credentials.
        Nunca se aceptan credenciales en la query string.

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
      description: Página, base 1.
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      description: Tamaño de página.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: |
        Clave única generada por el cliente. Reenviar la misma clave devuelve
        el recurso ya creado en lugar de duplicarlo.

  responses:
    Unauthenticated:
      description: Falta el token o está vencido.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: El scope del token no alcanza para la operación.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: El recurso no existe o no es visible para el token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Se superó el límite de requests.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Segundos a esperar antes de reintentar.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Money:
      type: object
      description: Importe monetario. `amount` es string para evitar floats ambiguos.
      required: [amount, currency]
      properties:
        amount: { type: string, pattern: '^-?\d+\.\d{2}$', examples: ['451.58'] }
        currency: { type: string, enum: [USD, ARS] }

    PaginatedEnvelope:
      type: object
      required: [data, meta, requestId]
      properties:
        data: { type: array, items: {} }
        meta:
          type: object
          required: [page, pageSize, total, totalPages]
          properties:
            page: { type: integer }
            pageSize: { type: integer }
            total: { type: integer }
            totalPages: { type: integer }
        requestId: { type: string }

    Error:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Código estable. Usar este valor para la lógica, no el mensaje.
            message: { type: string, description: Texto para humanos; puede cambiar entre versiones. }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  reason: { type: string }
        requestId: { type: string }

    Availability:
      type: string
      enum: [IN_STOCK, NEW_ARRIVAL, INCOMING, OUT_OF_STOCK]

    PaymentTerm:
      type: string
      enum: [CASH, TRANSFER_7, TRANSFER_15, CHECK_30, CREDIT_45]

    OrderStatus:
      type: string
      enum:
        [DRAFT, CONFIRMED, SALES_REVIEW, PENDING_APPROVAL, PENDING_PAYMENT, OBSERVED, PICKING, PARTIALLY_SHIPPED, SHIPPED, DELIVERED, CANCELLED]

    RmaStatus:
      type: string
      enum:
        [DRAFT, SUBMITTED, ASHIR_VALIDATION, AWAITING_SHIPMENT, RECEIVED, DIAGNOSIS, MANUFACTURER, RESOLUTION, READY_FOR_PICKUP, CLOSED, REJECTED]

    RmaProblemType:
      type: string
      enum: [NO_POWER, NO_VIDEO, INTERMITTENT, TEMPERATURE, NOISE, PHYSICAL_DAMAGE, INCOMPATIBILITY, MISSING_ACCESSORY, OTHER]

    Product:
      type: object
      required: [id, sku, name, brand, category, availability]
      properties:
        id: { type: string }
        sku: { type: string, description: Código interno de Ashir. Identificador comercial. }
        partNumber: { type: [string, 'null'] }
        name: { type: string }
        brand: { type: string }
        brandId: { type: string }
        category: { type: string }
        categoryId: { type: string }
        subcategory: { type: [string, 'null'] }
        listPrice:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: null cuando el producto figura sin precio publicado.
        suggestedRetail:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        vatRate: { type: number, examples: [0.21, 0.105] }
        cost:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Sólo con scope `cost:read`. Para el resto de los tokens llega null.
        marginPct:
          type: [number, 'null']
          description: Sólo con scope `margin:read`.
        stock: { type: integer }
        incoming:
          type: [object, 'null']
          properties:
            units: { type: integer }
            etaDays: { type: integer }
        availability: { $ref: '#/components/schemas/Availability' }
        warrantyMonths: { type: integer }
        specs: { type: array, items: { type: string } }
        image: { type: [string, 'null'], format: uri }

    Brand:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        skuCount: { type: integer }
        categories: { type: array, items: { type: string } }

    PriceAdjustment:
      type: object
      required: [type, label, amount]
      properties:
        type:
          type: string
          enum: [PRICE_LIST, CUSTOMER_DISCOUNT, PROMOTION, VOLUME_TIER, PAYMENT_TERM, SPECIAL_PRICE, FREIGHT]
        conditionId: { type: string, description: Condición comercial que lo generó, si aplica. }
        label: { type: string }
        percentage: { type: [string, 'null'] }
        amount: { type: string }
        note: { type: string }

    PriceEvaluation:
      type: object
      required: [productId, quantity, basePrice, adjustments, finalUnitPrice]
      properties:
        productId: { type: string }
        sku: { type: string }
        quantity: { type: integer }
        basePrice: { $ref: '#/components/schemas/Money' }
        adjustments:
          type: array
          items: { $ref: '#/components/schemas/PriceAdjustment' }
        finalUnitPrice: { $ref: '#/components/schemas/Money' }
        lineTotal: { $ref: '#/components/schemas/Money' }
        totalDiscountPct: { type: string }
        validUntil: { type: string, format: date-time }
        explanation: { type: string, description: Texto legible del cálculo. }
        appliedConditions:
          type: array
          items:
            type: object
            properties:
              conditionId: { type: string }
              code: { type: string }
              name: { type: string }
              effect: { type: string }
        skippedConditions:
          type: array
          description: Condiciones que no aplicaron, con su motivo. Es lo que hace el precio explicable.
          items:
            type: object
            properties:
              conditionId: { type: string }
              code: { type: string }
              name: { type: string }
              reason: { type: string }
        missedOpportunities:
          type: array
          description: Descuentos que están cerca de cumplirse.
          items:
            type: object
            properties:
              conditionId: { type: string }
              label: { type: string }
              message: { type: string }
              potentialPct: { type: string }
              missingUnits: { type: integer }
        tiers:
          type: array
          items:
            type: object
            properties:
              minQty: { type: integer }
              maxQty: { type: [integer, 'null'] }
              discountPct: { type: string }
              unitPrice: { $ref: '#/components/schemas/Money' }

    PriceList:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        segment: { type: [string, 'null'], enum: [SILVER, GOLD, PLATINUM, null] }
        baseAdjustmentPct: { type: string }
        customerCount: { type: integer }
        validFrom: { type: string, format: date-time }
        validTo: { type: [string, 'null'], format: date-time }
        status: { type: string, enum: [ACTIVE, DRAFT, ARCHIVED] }

    OrderItem:
      type: object
      properties:
        id: { type: string }
        productId: { type: string }
        sku: { type: string }
        name: { type: string }
        quantity: { type: integer }
        unitPrice: { $ref: '#/components/schemas/Money' }
        listPrice: { $ref: '#/components/schemas/Money' }
        discountPct: { type: string }
        lineTotal: { $ref: '#/components/schemas/Money' }
        appliedConditions: { type: array, items: { type: string } }
        shippedQty: { type: integer }

    Order:
      type: object
      required: [id, number, customerId, status, version, items, total]
      properties:
        id: { type: string }
        number: { type: string, examples: ['ASH-24853'] }
        customerId: { type: string }
        customerName: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        version:
          type: integer
          description: Se incrementa en cada modificación. Requerido para editar.
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        subtotal: { $ref: '#/components/schemas/Money' }
        discountTotal: { $ref: '#/components/schemas/Money' }
        taxTotal: { $ref: '#/components/schemas/Money' }
        freight: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        paymentTerm: { $ref: '#/components/schemas/PaymentTerm' }
        deliveryMethod: { type: string, enum: [DELIVERY, PICKUP] }
        customerPO: { type: [string, 'null'] }
        allowedModifications:
          type: array
          description: Qué se puede cambiar en el estado actual.
          items:
            type: string
            enum: [ADD_ITEM, REMOVE_ITEM, CHANGE_QTY, CHANGE_NOTES, CHANGE_DELIVERY, REQUEST_CHANGE, CANCEL]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AuditEvent:
      type: object
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        actor: { type: string }
        actorRole: { type: string, enum: [CLIENT, SALES, PM, RMA, ADMIN, SYSTEM] }
        action: { type: string }
        entity: { type: string }
        entityId: { type: string }
        previousValue: { type: [string, 'null'] }
        newValue: { type: [string, 'null'] }
        origin: { type: string, enum: [PORTAL, API, ERP, IMPORT, SYSTEM] }
        requestId: { type: string }
        comment: { type: [string, 'null'] }

    SerialRecord:
      type: object
      properties:
        serial: { type: string }
        sku: { type: string }
        productName: { type: string }
        brand: { type: string }
        orderNumber: { type: string }
        invoiceNumber: { type: string }
        purchasedAt: { type: string, format: date-time }
        warrantyMonths: { type: integer }
        warrantyExpiresAt: { type: string, format: date-time }
        lotId: { type: string }

    SerialLookupResult:
      type: object
      required: [status, serial, message]
      properties:
        status:
          type: string
          enum: [IN_WARRANTY, WARRANTY_EXPIRED, NEEDS_REVIEW, NOT_FOUND, NOT_YOUR_ACCOUNT, RMA_ALREADY_OPEN]
        serial: { type: string }
        record:
          description: |
            null cuando el serial no existe o pertenece a otra cuenta. En ese
            caso no se expone ningún dato comercial del tercero.
          oneOf:
            - $ref: '#/components/schemas/SerialRecord'
            - type: 'null'
        message: { type: string }
        warrantyDaysRemaining: { type: [integer, 'null'] }

    RmaSla:
      type: object
      properties:
        stage: { type: string, enum: [VALIDATION, DIAGNOSIS, RESOLUTION, DONE] }
        targetHours: { type: integer }
        elapsedHours: { type: integer }
        remainingHours: { type: integer }
        breached: { type: boolean }
        pausedReason: { type: [string, 'null'] }
        dueAt: { type: string, format: date-time }

    RmaUnit:
      type: object
      properties:
        id: { type: string }
        serial: { type: string }
        sku: { type: string }
        productName: { type: string }
        brand: { type: string }
        lotId: { type: string }
        problemType: { $ref: '#/components/schemas/RmaProblemType' }
        description: { type: string }
        status: { $ref: '#/components/schemas/RmaStatus' }

    RmaTimelineEvent:
      type: object
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/RmaStatus' }
        label: { type: string }
        actor: { type: string }
        actorRole: { type: string }
        comment: { type: [string, 'null'] }
        documents:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              type: { type: string }

    RmaCase:
      type: object
      required: [id, code, customerId, status, units]
      properties:
        id: { type: string }
        code: { type: string, examples: ['RMA-260194'] }
        customerId: { type: string }
        customerName: { type: string }
        status: { $ref: '#/components/schemas/RmaStatus' }
        isBatch: { type: boolean, description: true cuando agrupa varias unidades bajo una misma logística. }
        units:
          type: array
          items: { $ref: '#/components/schemas/RmaUnit' }
        sla: { $ref: '#/components/schemas/RmaSla' }
        createdAt: { type: string, format: date-time }
        closedAt: { type: [string, 'null'], format: date-time }

    PmBrandDashboard:
      type: object
      properties:
        brandId: { type: string }
        brand: { type: string }
        salesMonth: { $ref: '#/components/schemas/Money' }
        salesMonthVsPrevPct: { type: string }
        grossMarginPct: { type: string }
        stockValue: { $ref: '#/components/schemas/Money' }
        turnover: { type: string }
        coverageDays: { type: integer }
        monthlyTarget: { $ref: '#/components/schemas/Money' }
        targetProgressPct: { type: integer }
        activeCustomers: { type: integer }
        criticalSkus: { type: integer }
        rmaCount: { type: integer }
        rmaRatePct: { type: string }

    IntegrationEntity:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        direction: { type: string, enum: [OUTBOUND, INBOUND, BIDIRECTIONAL] }
        enabled: { type: boolean }
        lastUpdatedAt: { type: [string, 'null'], format: date-time }
        records: { type: integer }

    Integration:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [ERP, CONNECTOR, STOCK, PRICING, BILLING, LOGISTICS, RMA, NOTIFICATIONS] }
        status: { type: string, enum: [OPERATIONAL, DEGRADED, OFFLINE, NOT_CONFIGURED] }
        adapter: { type: string }
        mode: { type: string, enum: [MOCK, DEMO, PRODUCTION] }
        frequency: { type: string, enum: [MANUAL, EVERY_15M, HOURLY, DAILY] }
        lastSyncAt: { type: [string, 'null'], format: date-time }
        recordsProcessed: { type: integer }
        errorCount: { type: integer }
        entities:
          type: array
          items: { $ref: '#/components/schemas/IntegrationEntity' }

    WebhookEvent:
      type: object
      description: |
        Forma común de todas las notificaciones. El `eventId` es estable entre
        reintentos: el receptor debe usarlo para descartar duplicados.
      required: [eventId, type, occurredAt, apiVersion, data]
      properties:
        eventId: { type: string }
        type:
          type: string
          enum:
            - order.created
            - order.updated
            - order.status_changed
            - order.cancelled
            - special_price.approved
            - rma.created
            - rma.status_changed
            - rma.resolved
            - customer.updated
            - product.stock_changed
            - price_list.updated
            - integration.sync_failed
        occurredAt: { type: string, format: date-time }
        apiVersion: { type: string, examples: ['2026-09-01'] }
        data: { type: object, additionalProperties: true }

    IntegrationRun:
      type: object
      properties:
        id: { type: string }
        integrationId: { type: string }
        at: { type: string, format: date-time }
        process: { type: string }
        direction: { type: string, enum: [OUTBOUND, INBOUND, BIDIRECTIONAL] }
        records: { type: integer }
        durationMs: { type: integer }
        result: { type: string, enum: [SUCCESS, WARNING, FAILED] }
        warnings: { type: array, items: { type: string } }
        errors: { type: array, items: { type: string } }
        requestId: { type: string }

# ===========================================================================
# WEBHOOKS
# ===========================================================================

webhooks:
  orderStatusChanged:
    post:
      summary: order.status_changed
      description: El pedido cambió de estado dentro del flujo comercial o logístico.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEvent' }
            example:
              eventId: evt_1042
              type: order.status_changed
              occurredAt: '2026-09-22T11:04:12-03:00'
              apiVersion: '2026-09-01'
              data:
                orderId: ord_ash_24853
                number: ASH-24853
                previousStatus: PICKING
                status: SHIPPED
      responses:
        '200':
          description: El receptor procesó el evento. Cualquier 2xx dentro de 10 s es válido.

  rmaResolved:
    post:
      summary: rma.resolved
      description: El caso de garantía llegó a una resolución final.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEvent' }
      responses:
        '200':
          description: Evento procesado.

  integrationSyncFailed:
    post:
      summary: integration.sync_failed
      description: Una sincronización falló tras agotar los reintentos.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEvent' }
      responses:
        '200':
          description: Evento procesado.
